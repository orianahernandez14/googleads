<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Simulador interactivo de campañas publicitarias."><title>Laboratorio de Google Ads</title></head><body><div id="ads-lab">
<style>
#ads-lab{color-scheme:light dark;--paper:light-dark(#fff,#20242b);--bg:light-dark(#f1f4f9,#171a20);--ink:light-dark(#202124,#edf1fa);--sub:light-dark(#4e596b,#b6c2d4);--line:light-dark(#dce3ee,#3b4557);--blue:light-dark(#1558bb,#a5caff);font:14px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
#ads-lab *{box-sizing:border-box}#ads-lab [hidden]{display:none!important}
#ads-lab header,#ads-lab nav,#ads-lab main{padding:14px 22px}#ads-lab header{background:var(--paper);border-bottom:1px solid var(--line);padding-right:105px}
#ads-lab h2,#ads-lab h3,#ads-lab p{margin:0}#ads-lab h2{font-size:22px}#ads-lab h3{font-size:17px;margin-bottom:10px}#ads-lab small,#ads-lab .muted{color:var(--sub)}
#ads-lab nav,#ads-lab .fields{display:flex;flex-wrap:wrap;gap:10px}#ads-lab button,#ads-lab input{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
#ads-lab button[aria-pressed=true]{background:var(--blue);color:var(--paper);border-color:var(--blue)}
#ads-lab .fields{margin-bottom:15px;align-items:end}#ads-lab label{display:grid;gap:4px;flex:1 1 145px}#ads-lab input{width:100%;min-width:0}#ads-lab .panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
#ads-lab .scroll{overflow:auto}#ads-lab table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}#ads-lab th,#ads-lab td{text-align:right;padding:9px;border-bottom:1px solid var(--line)}#ads-lab th:first-child,#ads-lab td:first-child{text-align:left}#ads-lab th{color:var(--sub);font-weight:600}#ads-lab tfoot{font-weight:700}#ads-lab .money{white-space:nowrap}
#ads-lab summary{color:var(--blue);padding:8px 0}#ads-lab .note{margin-top:10px}#ads-lab #ads-error{color:light-dark(#a72417,#ffaca5);margin-bottom:10px}
@media(max-width:520px){#ads-lab header,#ads-lab nav,#ads-lab main{padding-left:12px;padding-right:12px}#ads-lab header{padding-right:92px}#ads-lab .panel{padding:11px}}

body{margin:0;background:#f0f2f4}
#ads-lab{color-scheme:light;--paper:#fff;--bg:#eff1f3;--ink:#202124;--sub:#5f6368;--line:#dadce0;--blue:#1967d2;font-family:Arial,sans-serif;min-height:100vh}
#ads-lab header{height:63px;display:flex;align-items:center;justify-content:space-between;padding:0 25px;background:var(--bg);position:sticky;top:0;z-index:1}
#ads-lab .brand{display:flex;align-items:center;gap:10px;font-size:21px;color:#5f6368}
#ads-lab .brand-mark{position:relative;width:28px;height:27px;display:inline-block}
#ads-lab .brand-mark i,#ads-lab .brand-mark b{position:absolute;top:1px;width:9px;height:25px;border-radius:8px;transform:rotate(30deg);left:5px;background:#fbbc04}
#ads-lab .brand-mark b{left:13px;transform:rotate(-30deg);background:#4285f4}
#ads-lab .brand-mark em{position:absolute;left:1px;bottom:1px;width:9px;height:9px;border-radius:50%;background:#34a853}
#ads-lab .shell{display:grid;grid-template-columns:70px 206px minmax(0,1fr);min-height:calc(100vh - 63px)}
#ads-lab .rail{display:flex;flex-direction:column;align-items:stretch;gap:11px;padding:13px 4px;border-right:1px solid var(--line)}
#ads-lab .rail button{padding:3px 0;font-size:10px;border:0;background:transparent;color:#5f6368}
#ads-lab .rail button[aria-pressed=true]{color:#1967d2}
#ads-lab .rail span{display:block;margin:0 auto 3px;width:39px;border-radius:20px;font-size:19px;line-height:26px}
#ads-lab .rail button[aria-pressed=true] span{background:#1a73e8;color:#fff}
#ads-lab .sidebar{padding:14px 9px}
#ads-lab .side-title{padding:8px 12px;color:#5f6368;font-size:12px}
#ads-lab nav{background:#fff;border-radius:18px;padding:8px 0;flex-direction:column;gap:4px}
#ads-lab nav button{border:0;border-radius:22px;text-align:left;padding:10px 13px}
#ads-lab nav button[aria-pressed=true]{background:#1a73e8;color:#fff}
#ads-lab .side-note{font-size:12px;padding:13px 12px;color:#5f6368}
#ads-lab main{padding:15px 23px 25px 12px;min-width:0}
#ads-lab .crumb{width:max-content;border:1px solid #bdc1c6;background:#fff;border-radius:4px;padding:3px 12px;font-size:12px}
#ads-lab .crumb span{display:block;color:#5f6368}
#ads-lab .page-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:14px 0;border-top:1px solid var(--line);padding-top:12px}
#ads-lab h1{font-size:20px;font-weight:400;margin:0}
#ads-lab .period{padding:6px 10px;border:1px solid #bdc1c6;border-radius:4px;font-size:12px}
#ads-lab .fields{gap:8px;align-items:end}
#ads-lab label{flex:0 1 190px;font-size:12px}
#ads-lab input,#ads-lab #ads-reset{border-radius:4px;padding:6px 9px}
#ads-lab #ads-reset{color:#1967d2}
#ads-lab .panel{border-radius:0;padding:12px;background:#fff}
#ads-lab table{font-size:12px}
#ads-lab th,#ads-lab td{border:1px solid #dadce0;padding:9px 8px}
#ads-lab tbody th{color:#1967d2;font-weight:400}
#ads-lab tfoot{background:#f4f6f9}
#ads-lab button,#ads-lab summary{cursor:pointer}
@media(max-width:800px){#ads-lab .shell{grid-template-columns:60px minmax(0,1fr)}#ads-lab .sidebar{display:none}}
@media(max-width:450px){#ads-lab .shell{grid-template-columns:minmax(0,1fr)}#ads-lab .rail{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:4px 10px;gap:18px}#ads-lab header{padding:0 12px}#ads-lab .brand{font-size:17px}#ads-lab main{padding:10px}#ads-lab label{flex:1 1 130px}}

#ads-lab #ads-menu{border:0;background:transparent;padding:4px 6px;margin-right:9px;color:#5f6368}
#ads-lab .shell{grid-template-columns:70px 250px minmax(0,1fr)}
#ads-lab .sidebar{padding:14px 9px}
#ads-lab .rail{border:0;gap:14px}
#ads-lab .rail .create span{height:50px;width:50px;line-height:49px;font-size:34px;color:#1a73e8;background:white;box-shadow:0 2px 5px #0003;border-radius:50%}
#ads-lab nav{background:transparent;padding:0;gap:5px}
#ads-lab nav button{background:transparent;width:100%;font-size:13px;color:#202124;padding:11px 14px}
#ads-lab nav button:hover{background:#e5ebf4}
#ads-lab nav button[aria-pressed=true]{background:#1a73e8;color:white}
#ads-lab .campaign-group{background:white;border-radius:24px;padding:4px 7px 9px}
#ads-lab .campaign-group summary{list-style:none;padding:10px 14px;color:#1967d2;font-size:13px}
#ads-lab .campaign-group summary::after,#ads-lab .with-chevron::after{content:'⌄';float:right}
#ads-lab .campaign-group[open] summary::after{content:'⌃'}
#ads-lab .campaign-group button{padding-left:24px}
#ads-lab.menu-collapsed .shell{grid-template-columns:70px minmax(0,1fr)}
#ads-lab.menu-collapsed .sidebar{display:none}
@media(max-width:800px){
  #ads-lab .shell,#ads-lab.menu-collapsed .shell{grid-template-columns:60px minmax(0,1fr)}
  #ads-lab .rail{grid-row:1 / span 2}
  #ads-lab .sidebar{display:block;grid-column:2}
  #ads-lab main{grid-column:2}
}
#ads-lab .workspace-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
#ads-lab .workspace-bar label{flex:0 1 240px}#ads-lab .primary{background:#1a73e8;color:#fff;border-color:#1a73e8}
#ads-lab .workspace-bar select,#ads-lab dialog select,#ads-lab dialog textarea{font:inherit;padding:8px;border:1px solid #dadce0;border-radius:4px;background:white;color:#202124;width:100%}
#ads-lab .empty{text-align:center;padding:36px 12px;color:#5f6368}#ads-lab .actions{display:flex;gap:5px;justify-content:flex-end}#ads-lab .actions button{padding:4px 8px;color:#1967d2}
#ads-lab td{text-align:left}#ads-lab th{text-align:left;white-space:normal}
#ads-lab dialog{width:min(560px,calc(100% - 28px));border:1px solid #dadce0;border-radius:12px;padding:23px;color:#202124;background:white}
#ads-lab dialog::backdrop{background:#20212466}#ads-lab dialog form{display:grid;gap:12px}
#ads-lab dialog label{display:grid;gap:4px}#ads-lab dialog footer{display:flex;gap:8px;justify-content:flex-end}
#ads-lab .overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
#ads-lab .overview article{background:white;border:1px solid #dadce0;padding:15px}
#ads-lab .overview strong{display:block;font-size:22px;margin-top:6px}
#ads-lab .hint{margin:0 0 12px;color:#5f6368}#ads-lab [role=alert]{color:#a72417}
</style>
<header><div class="brand"><button type="button" id="ads-menu" aria-label="Mostrar u ocultar menú" aria-expanded="true" aria-controls="ads-sidebar">☰</button><span aria-hidden="true" class="brand-mark"><i></i><b></b><em></em></span>Google Ads</div></header>
<div class="shell">
<aside class="rail" aria-label="Secciones principales">
<button type="button" data-rail="create" id="ads-create" class="create"><span aria-hidden="true">+</span>Crear</button>
<button type="button" data-rail="campaigns" data-view-target="campaigns" aria-pressed="true"><span aria-hidden="true">◀</span>Campañas</button>
<button type="button" data-rail="goals" data-view-target="goals"><span aria-hidden="true">♜</span>Objetivos</button>
<button type="button" data-rail="tools" data-view-target="tools"><span aria-hidden="true">⚒</span>Herramientas</button>
<button type="button" data-rail="billing" data-view-target="billing" aria-pressed="false"><span aria-hidden="true">▤</span>Facturación</button>
<button type="button" data-rail="admin" data-view-target="admin"><span aria-hidden="true">⚙</span>Administración</button>
</aside>
<div class="sidebar" id="ads-sidebar">
<nav aria-label="Menú de Campañas" id="ads-campaign-menu">
<button type="button" data-view-target="overview">Vista general</button>
<button type="button" data-view-target="recommendations">Recomendaciones</button>
<button type="button" data-view-target="reports" class="with-chevron">Estadísticas e informes</button>
<details class="campaign-group" open><summary>Campañas</summary>
<button type="button" data-view-target="campaigns" aria-pressed="true">Campañas</button>
<button type="button" data-view-target="groups" aria-pressed="false">Grupos de anuncios</button>
<button type="button" data-view-target="ads">Anuncios</button>
<button type="button" data-view-target="experiments">Experimentos</button>
<button type="button" data-view-target="sets">Grupos de campañas</button>
</details>
<button type="button" data-view-target="assets" class="with-chevron">Recursos</button>
<button type="button" data-view-target="targeting" class="with-chevron">Audiencias, palabras clave y contenido</button>
<button type="button" data-view-target="history">Historial de cambios</button>
</nav>
<nav aria-label="Menú de Facturación" id="ads-billing-menu" hidden>
<button type="button" data-view-target="billing" aria-pressed="false">Resumen</button>
</nav>
<p class="side-note">Simulador de práctica</p></div>
<main>
<div class="crumb"><span>Vista</span><strong>Todas las campañas</strong></div>
<div class="page-head"><h1 id="ads-page-title">Campañas</h1><small>Simulador de práctica</small></div>
<p class="hint" id="ads-description"></p>
<p id="ads-status" role="status"></p>
<div class="workspace-bar" id="ads-bar">
<button type="button" class="primary" id="ads-new">+ Crear</button>
<label>Buscar<input type="search" id="ads-search" placeholder="Buscar en esta sección"></label>
</div>
<section id="ads-content" aria-labelledby="ads-page-title"></section>
<dialog id="ads-dialog">
<form id="ads-form">
<h2 id="ads-dialog-title"></h2>
<div id="ads-form-fields" class="fields"></div>
<p id="ads-form-error" role="alert"></p>
<footer><button type="button" id="ads-cancel">Cancelar</button><button class="primary" type="submit">Guardar</button></footer>
</form>
</dialog>
</main></div></div>
<script>
(() => {
  const root = document.getElementById('ads-lab');
  const get = key => root.querySelector('#ads-' + key);
  const field = (key, label, type = 'text', optional = false) => ({key, label, type, optional});
  const select = (key, label, options) => ({key, label, type:'select', options});
  const relation = (key, label, target, optional = false) => ({key, label, type:'select', target, optional});
  const name = () => field('name','Nombre');
  const note = () => field('note','Notas','textarea',true);
  const campaign = (optional = false) => relation('campaign','Campaña','campaigns',optional);
  const state = () => select('status','Estado',['Borrador','Habilitada','En pausa']);
  const schema = {
    campaigns: ['Campañas','Nueva campaña','Configura objetivo, tipo, segmentación y presupuesto de una campaña de práctica.',[
      name(),select('objective','Objetivo',['Ventas','Clientes potenciales','Tráfico al sitio web','Notoriedad y consideración','Sin orientación de objetivo']),
      select('kind','Tipo',['Búsqueda','Display','Vídeo','Shopping','Aplicaciones','Máximo rendimiento','Generación de demanda']),
      field('budget','Presupuesto diario (ARS)','money'),select('bid','Puja',['Maximizar clics','Maximizar conversiones','CPV objetivo','CPC manual','CPM objetivo']),
      field('location','Ubicaciones'),field('language','Idiomas'),field('start','Inicio','date'),field('end','Fin','date',true),state()
    ]],
    groups: ['Grupos de anuncios','Nuevo grupo de anuncios','Organiza los anuncios de cada campaña y registra sus métricas manualmente.',[
      name(),campaign(),select('kind','Tipo',['Estándar','Adaptable','Vídeo']),field('bid','Puja objetivo (ARS)','money',true),
      field('impressions','Impresiones','integer',true),field('views','Vistas TrueView','integer',true),field('cost','Coste (ARS)','money',true),state()
    ]],
    ads: ['Anuncios','Nuevo anuncio','Crea anuncios dentro de un grupo y carga sus creatividades manualmente.',[
      name(),relation('group','Grupo de anuncios','groups'),select('kind','Formato',['Búsqueda adaptable','Display adaptable','Vídeo in-stream','Vídeo in-feed','Shorts']),
      field('headline','Título'),field('description','Descripción','textarea'),field('url','URL final','url'),field('creative','URL del recurso','url',true),state()
    ]],
    recommendations: ['Recomendaciones','Nueva recomendación','Registra observaciones y decide cuáles aplicar en la práctica.',[
      name(),campaign(true),field('description','Recomendación','textarea'),select('status','Estado',['Pendiente','Aplicada','Descartada'])
    ]],
    reports: ['Estadísticas e informes','Nuevo informe','Registra métricas manuales por campaña y periodo.',[
      name(),campaign(),field('start','Inicio','date'),field('end','Fin','date'),
      field('impressions','Impresiones','integer',true),field('clicks','Clics','integer',true),
      field('views','Vistas TrueView','integer',true),field('conversions','Conversiones','integer',true),field('cost','Coste (ARS)','money',true),note()
    ]],
    experiments: ['Experimentos','Nuevo experimento','Define una hipótesis y compara una variante con una campaña base.',[
      name(),campaign(),field('hypothesis','Hipótesis','textarea'),field('share','Tráfico de la variante (%)','percent'),
      field('start','Inicio','date'),field('end','Fin','date',true),select('status','Estado',['Borrador','En curso','Finalizado'])
    ]],
    sets: ['Grupos de campañas','Nuevo grupo de campañas','Agrupa campañas y registra un objetivo compartido.',[
      name(),{...relation('campaigns','Campañas','campaigns'),multiple:true},field('goal','Objetivo compartido'),note()
    ]],
    assets: ['Recursos','Nuevo recurso','Carga referencias a imágenes, vídeos y textos para usar en la práctica.',[
      name(),select('kind','Tipo',['Imagen','Vídeo','Texto','Enlace']),field('value','URL o contenido','textarea'),campaign(true),note()
    ]],
    targeting: ['Audiencias, palabras clave y contenido','Nueva segmentación','Define a quién o dónde mostrar un anuncio de práctica.',[
      name(),campaign(),select('kind','Tipo',['Audiencia','Palabra clave','Tema','Emplazamiento']),
      field('value','Criterio'),select('mode','Modo',['Segmentación','Observación','Exclusión']),note()
    ]],
    goals: ['Objetivos','Nueva acción de conversión','Configura qué acción medir y cómo clasificarla.',[
      name(),campaign(true),select('kind','Categoría',['Compra','Registro','Formulario','Llamada','Otra']),
      select('source','Origen',['Sitio web','Aplicación','Llamada','Importación manual']),field('value','Valor (ARS)','money',true),
      select('status','Optimización',['Principal','Secundaria'])
    ]],
    tools: ['Herramientas','Nueva herramienta de planificación','Guarda estimaciones o planes de práctica para tus campañas.',[
      name(),select('kind','Tipo',['Plan de palabras clave','Plan de rendimiento','Plan de alcance','Diagnóstico de anuncios']),
      campaign(true),field('budget','Presupuesto estimado (ARS)','money',true),note()
    ]],
    billing: ['Facturación','Nuevo movimiento','Registra movimientos simulados. Usa una referencia ficticia y un importe en ARS.',[
      field('date','Fecha','date'),select('kind','Tipo',['Pago','Cargo','Ajuste','Reembolso']),
      field('reference','Referencia ficticia'),field('amount','Importe (ARS)','money'),
      select('status','Estado',['Pendiente','Confirmado','Rechazado']),note()
    ]],
    admin: ['Administración','Nueva configuración','Practica la configuración de cuenta y roles con datos ficticios.',[
      name(),select('kind','Tipo',['Cuenta','Acceso']),select('role','Rol',['Administrador','Estándar','Solo lectura','Facturación']),
      field('timezone','Zona horaria'),field('currency','Moneda'),note()
    ]]
  };
  const storageKey = 'ads-training-manual-v1';
  let data;
  try { data = JSON.parse(localStorage.getItem(storageKey)) || {}; } catch { data = {}; }
  const rows = key => data[key] || [];
  let current = 'campaigns';
  let editing;
  const dialog = get('dialog');
  const format = new Intl.NumberFormat('es-AR');
  const ars = new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',currencyDisplay:'code'});
  const escape = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const recordLabel = (key,id) => rows(key).find(row => row.id === id)?.name || '—';
  function display(field, value) {
    if (value === '' || value == null) return '—';
    if (field.target) return (Array.isArray(value) ? value : [value]).map(id => recordLabel(field.target,id)).join(', ') || '—';
    if (field.type === 'money') return ars.format(value);
    if (field.type === 'integer') return format.format(value);
    if (field.type === 'percent') return format.format(value) + ' %';
    return value;
  }
  function openView(key) {
    current = key;
    get('search').value = '';
    get('status').textContent = '';
    root.querySelectorAll('[data-view-target]').forEach(button => {
      const railGroup = !['goals','tools','billing','admin'].includes(key) ? 'campaigns' : key;
      button.setAttribute('aria-pressed',String(button.dataset.rail ? button.dataset.rail === railGroup : button.dataset.viewTarget === key));
    });
    get('campaign-menu').hidden = ['goals','tools','billing','admin'].includes(key);
    get('billing-menu').hidden = key !== 'billing';
    render();
  }
  function render() {
    const config = schema[current];
    get('page-title').textContent = config?.[0] || (current === 'overview' ? 'Vista general' : 'Historial de cambios');
    get('description').textContent = config?.[2] || (current === 'overview' ? 'Consulta los datos que cargaste en este navegador.' : 'Los cambios guardados aparecen aquí automáticamente.');
    get('bar').hidden = current === 'overview';
    get('new').hidden = !config;
    get('new').textContent = '+ ' + (config?.[1] || '');
    if (current === 'overview') {
      const views = rows('groups').reduce((sum,row) => sum + (row.views || 0),0);
      const cost = rows('groups').reduce((sum,row) => sum + (row.cost || 0),0);
      get('content').innerHTML = '<div class="overview">' + [
        ['Campañas',rows('campaigns').length],['Grupos de anuncios',rows('groups').length],
        ['Anuncios',rows('ads').length],['Vistas TrueView',format.format(views)],['Coste registrado',ars.format(cost)]
      ].map(([label,value]) => '<article>'+label+'<strong>'+value+'</strong></article>').join('') + '</div>';
      return;
    }
    const fields = config?.[3] || [field('date','Fecha'),field('section','Sección'),field('action','Acción'),field('name','Registro')];
    const query = get('search').value.trim().toLocaleLowerCase('es');
    const filtered = rows(current).filter(row => fields.some(field => String(display(field,row[field.key])).toLocaleLowerCase('es').includes(query)));
    if (!filtered.length) {
      get('content').innerHTML = '<div class="panel empty">' + (query ? 'No hay resultados para esta búsqueda.' : 'Todavía no hay registros.') + '</div>';
      return;
    }
    const hasCpv = ['groups','reports'].includes(current);
    const header = fields.map(field => '<th scope="col">'+field.label+'</th>').join('') +
      (hasCpv ? '<th scope="col">CPV medio</th>' : '') + (config ? '<th scope="col">Acciones</th>' : '');
    const body = filtered.map(row => '<tr>'+fields.map(field => '<td>'+escape(display(field,row[field.key]))+'</td>').join('') +
      (hasCpv ? '<td>'+(row.views > 0 && typeof row.cost === 'number' ? ars.format(row.cost / row.views) : '—')+'</td>' : '') +
      (config ? '<td><div class="actions"><button type="button" data-edit="'+row.id+'">Editar</button><button type="button" data-remove="'+row.id+'">Eliminar</button></div></td>' : '')+'</tr>').join('');
    get('content').innerHTML = '<div class="panel scroll"><table><thead><tr>'+header+'</tr></thead><tbody>'+body+'</tbody></table></div>';
  }
  function openForm(key, row) {
    const config = schema[key];
    editing = {key,row};
    get('dialog-title').textContent = row ? 'Editar · '+config[0] : config[1];
    get('form-error').textContent = '';
    get('form-fields').innerHTML = config[3].map(field => {
      const value = row?.[field.key] ?? '';
      const required = field.optional ? '' : ' required';
      let control;
      if (field.type === 'select') {
        const options = field.target ? rows(field.target).map(item => [item.id,item.name]) : field.options.map(item => [item,item]);
        control = '<select name="'+field.key+'"'+required+(field.multiple?' multiple':'')+'>'+
          (field.multiple ? '' : '<option value="">Seleccionar</option>')+
          options.map(([id,label]) => '<option value="'+escape(id)+'"'+((Array.isArray(value) ? value.includes(id) : value === id)?' selected':'')+'>'+escape(label)+'</option>').join('')+'</select>';
        if (field.target && !options.length) control += '<small>Crea primero un registro en '+schema[field.target][0]+'.</small>';
      } else if (field.type === 'textarea') {
        control = '<textarea name="'+field.key+'"'+required+'>'+escape(value)+'</textarea>';
      } else {
        const numeric = ['money','integer','percent'].includes(field.type);
        control = '<input name="'+field.key+'" type="'+(numeric?'number':field.type)+'" value="'+escape(value)+'"'+required+
          (numeric?' min="0" step="'+(field.type==='integer'?'1':'0.01')+'"':'')+(field.type==='percent'?' max="100"':'')+'>';
      }
      return '<label>'+field.label+control+'</label>';
    }).join('');
    dialog.showModal();
  }
  function save(key, next, action, row) {
    const entry = {id:crypto.randomUUID(),date:new Date().toLocaleString('es-AR'),section:schema[key][0],action,name:row.name || row.reference || 'Registro'};
    const updated = {...data,[key]:next,history:[entry,...rows('history')]};
    try { localStorage.setItem(storageKey,JSON.stringify(updated)); }
    catch { get(dialog.open?'form-error':'status').textContent = 'El navegador no pudo guardar el cambio.'; return false; }
    data = updated;
    return true;
  }
  get('form').addEventListener('submit',event => {
    event.preventDefault();
    const {key,row} = editing;
    const values = new FormData(event.currentTarget);
    const next = {id:row?.id || crypto.randomUUID()};
    for (const field of schema[key][3]) {
      const value = String(values.get(field.key) ?? '').trim();
      if (!value && !field.optional) {
        get('form-error').textContent = 'Completa el campo '+field.label+'.';
        return;
      }
      next[field.key] = field.multiple ? values.getAll(field.key) : value && ['money','integer','percent'].includes(field.type) ? Number(value) : value;
    }
    if (next.end && next.start && next.end < next.start) { get('form-error').textContent = 'La fecha de fin debe ser posterior o igual al inicio.'; return; }
    if (next.impressions !== undefined && next.impressions !== '' && next.views > next.impressions) {
      get('form-error').textContent = 'Las vistas TrueView no pueden superar las impresiones.'; return;
    }
    if (!save(key,row ? rows(key).map(item => item.id === row.id ? next : item) : [...rows(key),next],row?'Editado':'Creado',next)) return;
    dialog.close();
    openView(key);
    get('status').textContent = 'Registro guardado.';
  });
  get('content').addEventListener('click',event => {
    const button = event.target.closest('[data-edit],[data-remove]');
    if (!button) return;
    const row = rows(current).find(row => row.id === (button.dataset.edit || button.dataset.remove));
    if (!row) return;
    if (button.dataset.edit) { openForm(current,row); return; }
    const usedBy = Object.entries(schema).find(([key,config]) => config[3].some(field => field.target === current &&
      rows(key).some(item => Array.isArray(item[field.key]) ? item[field.key].includes(row.id) : item[field.key] === row.id)));
    if (usedBy) { get('status').textContent = 'Quita primero las referencias en '+usedBy[1][0]+'.'; return; }
    if (confirm('¿Eliminar este registro de práctica?') && save(current,rows(current).filter(item => item.id !== row.id),'Eliminado',row)) {
      render(); get('status').textContent = 'Registro eliminado.';
    }
  });
  root.querySelectorAll('[data-view-target]').forEach(button => button.addEventListener('click',() => openView(button.dataset.viewTarget)));
  get('menu').addEventListener('click',() => get('menu').setAttribute('aria-expanded',String(!root.classList.toggle('menu-collapsed'))));
  get('new').addEventListener('click',() => openForm(current));
  get('create').addEventListener('click',() => openForm('campaigns'));
  get('cancel').addEventListener('click',() => dialog.close());
  get('search').addEventListener('input',render);
  openView('campaigns');
})();
</script>
</body></html>
